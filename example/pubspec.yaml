name: hyper_effects_demo
description: A demo that showcases the hyper_effects package.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  adaptive_theme: ^3.8.0
  flutter_box_transform: ^0.4.7
  hyper_effects:
    path: ../
  google_fonts: ^8.2.1
  unicode_emojis: ^0.5.1
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fashion/
